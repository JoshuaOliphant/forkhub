[project]
name = "forkhub-worker-library"
version = "0.4.0"
description = "ForkHub library sources for the read-only Workers runtime"
requires-python = ">=3.12"

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "../../../src/forkhub/**/*.py"},
    {file = "../../../src/forkhub/**/*.sql"},
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"../../../src/forkhub" = "forkhub"
