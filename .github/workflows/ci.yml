name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cloudflare-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: npm ci
        working-directory: deploy/cloudflare
      - name: Build the production Worker from the checkout
        working-directory: deploy/cloudflare
        run: uv run pywrangler deploy --dry-run
      - name: Exercise authenticated MCP calls against local Workers and D1
        run: uv run pytest tests/test_cloudflare_runtime.py -o addopts='' -m integration -x -q
        env:
          WRANGLER_SEND_METRICS: "false"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra claude
      - run: uv run ruff check src/ tests/ examples/ deploy/cloudflare/src/
      - run: uv run ruff format --check src/ tests/ examples/ deploy/cloudflare/src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra claude
      - run: uv run pytest -m "not integration and not slow" -x -q
